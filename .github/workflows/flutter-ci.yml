
name: Flutter CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "lab_03_lesson_05/**"
      - ".github/workflows/flutter-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "lab_03_lesson_05/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab_03_lesson_05

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test
